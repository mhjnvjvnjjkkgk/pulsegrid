<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseGrid — Hospital Desk</title>
  <meta name="description" content="Hospital staff dashboard for PulseGrid — verify OTP holds, manage bed counts, view inbound patients.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* ── Design tokens (dark clinical theme) ── */
    :root {
      --bg:      #070b14;
      --surface: #0c1120;
      --panel:   rgba(255,255,255,0.05);
      --border:  rgba(255,255,255,0.09);
      --border-hi: rgba(255,255,255,0.18);
      --text-1:  #f0f4ff;
      --text-2:  #8b9cb5;
      --text-3:  #4d5e75;
      --blue:    #3b82f6;
      --blue-g:  rgba(59,130,246,0.20);
      --purple:  #8b5cf6;
      --green:   #10b981;
      --green-g: rgba(16,185,129,0.18);
      --amber:   #f59e0b;
      --amber-g: rgba(245,158,11,0.18);
      --red:     #f43f5e;
      --red-g:   rgba(244,63,94,0.18);
      --cyan:    #06b6d4;
      --r: 14px;
    }

    *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text-1);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
    }

    body::before {
      content:'';
      position:fixed; inset:0;
      background-image:
        linear-gradient(rgba(59,130,246,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,130,246,0.03) 1px, transparent 1px);
      background-size: 36px 36px;
      pointer-events:none;
    }

    /* ── Glass panel ── */
    .glass {
      background: var(--panel);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--r);
      position: relative;
      overflow: hidden;
    }
    .glass::before {
      content:'';
      position:absolute; top:0; left:0; right:0; height:1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    }

    /* ── Header ── */
    .header {
      position:sticky; top:0; z-index:100;
      height:60px;
      background:rgba(7,11,20,0.8);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display:flex; align-items:center;
      padding: 0 24px;
      gap:16px;
    }

    .header-logo {
      display:flex; align-items:center; gap:10px;
      font-family:'Outfit',sans-serif; font-size:1.1rem; font-weight:700;
      color:var(--text-1); text-decoration:none;
    }

    .header-logo-icon {
      width:32px; height:32px; border-radius:8px;
      background:linear-gradient(135deg,var(--blue),var(--purple));
      display:flex; align-items:center; justify-content:center;
    }

    .header-tag {
      padding:3px 10px; border-radius:999px;
      background:rgba(245,158,11,0.12); border:1px solid rgba(245,158,11,0.25);
      font-size:0.72rem; font-weight:600; color:var(--amber);
      letter-spacing:0.06em;
    }

    .header-spacer { flex:1; }

    .citizen-link {
      font-size:0.78rem; color:var(--text-2);
      text-decoration:none; padding:6px 14px;
      border:1px solid var(--border); border-radius:8px;
      transition:all 0.2s;
    }
    .citizen-link:hover { border-color:var(--border-hi); color:var(--text-1); }

    /* ── Layout ── */
    .page { max-width:1300px; margin:0 auto; padding:24px; }

    .top-row {
      display:grid;
      grid-template-columns: 280px 1fr;
      gap:20px;
      margin-bottom:20px;
    }

    /* ── Hospital selector ── */
    .hosp-select-panel { padding:20px; }

    .panel-title {
      font-family:'Outfit',sans-serif;
      font-size:0.85rem; font-weight:700;
      color:var(--text-2); letter-spacing:0.06em; text-transform:uppercase;
      margin-bottom:14px;
    }

    .hosp-list { display:flex; flex-direction:column; gap:6px; max-height:400px; overflow-y:auto; }

    .hosp-item {
      padding:10px 14px; border-radius:10px;
      cursor:pointer; transition:all 0.2s;
      border:1px solid transparent;
    }
    .hosp-item:hover { background:rgba(255,255,255,0.04); border-color:var(--border); }
    .hosp-item.selected { background:rgba(59,130,246,0.10); border-color:rgba(59,130,246,0.35); }

    .hosp-item-name { font-size:0.85rem; font-weight:600; color:var(--text-1); }
    .hosp-item-type {
      font-size:0.68rem; font-weight:600;
      padding:1px 7px; border-radius:999px; margin-top:3px; display:inline-block;
    }
    .govt { background:rgba(16,185,129,0.10); border:1px solid rgba(16,185,129,0.2); color:var(--green); }
    .pvt  { background:rgba(59,130,246,0.10); border:1px solid rgba(59,130,246,0.2); color:var(--blue); }

    /* ── Stats panel ── */
    .stats-panel { padding:24px; }

    .hosp-header-name {
      font-family:'Outfit',sans-serif;
      font-size:1.4rem; font-weight:800; color:var(--text-1);
      margin-bottom:4px;
    }

    .hosp-header-address { font-size:0.82rem; color:var(--text-3); margin-bottom:20px; }

    .wards-grid {
      display:grid; grid-template-columns:repeat(4,1fr); gap:14px;
      margin-bottom:20px;
    }

    @media(max-width:900px){ .wards-grid{ grid-template-columns:1fr 1fr; } }
    @media(max-width:600px){ .wards-grid{ grid-template-columns:1fr; } }

    /* ── Ward counter card ── */
    .ward-card {
      padding:18px; border-radius:var(--r);
      border:1px solid var(--border);
      background:var(--panel);
      display:flex; flex-direction:column; gap:12px;
      transition:border-color 0.2s;
    }

    .ward-card:hover { border-color:var(--border-hi); }

    .ward-card-name {
      font-size:0.75rem; font-weight:600;
      color:var(--text-3); text-transform:uppercase; letter-spacing:0.06em;
    }

    .ward-avail-count {
      font-family:'Outfit',sans-serif;
      font-size:2.4rem; font-weight:800; line-height:1;
    }

    .ward-avail-label { font-size:0.72rem; color:var(--text-3); }

    .ward-bar-track {
      height:6px; border-radius:999px;
      background:rgba(255,255,255,0.06);
      overflow:hidden;
    }

    .ward-bar-fill {
      height:100%; border-radius:999px;
      transition:width 0.6s ease;
    }

    .ward-adj {
      display:flex; align-items:center; gap:8px;
      justify-content:space-between;
    }

    .adj-info { font-size:0.78rem; color:var(--text-2); }

    .adj-btns { display:flex; gap:6px; }

    .adj-btn {
      width:30px; height:30px; border-radius:8px;
      border:1px solid var(--border);
      background:rgba(255,255,255,0.04);
      color:var(--text-1); font-size:1rem;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      transition:all 0.15s; font-weight:700;
    }
    .adj-btn:hover { background:rgba(255,255,255,0.08); border-color:var(--border-hi); }
    .adj-btn.plus:hover { background:rgba(16,185,129,0.15); border-color:rgba(16,185,129,0.4); color:var(--green); }
    .adj-btn.minus:hover { background:rgba(244,63,94,0.15); border-color:rgba(244,63,94,0.4); color:var(--red); }

    /* ── Bottom row ── */
    .bottom-row { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
    @media(max-width:700px){ .bottom-row{ grid-template-columns:1fr; } }

    /* ── OTP Verify panel ── */
    .otp-panel { padding:24px; }

    .otp-digits {
      display:flex; gap:10px; justify-content:center;
      margin:20px 0;
    }

    .otp-digit {
      width:60px; height:72px;
      border-radius:12px;
      background:rgba(255,255,255,0.04);
      border:2px solid var(--border);
      font-family:'JetBrains Mono',monospace;
      font-size:2rem; font-weight:700; text-align:center; color:var(--text-1);
      outline:none; transition:all 0.2s;
    }

    .otp-digit:focus { border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-g); }

    .otp-verify-btn {
      width:100%; padding:14px;
      border-radius:var(--r); border:none;
      background:linear-gradient(135deg,var(--blue),var(--purple));
      color:#fff; font-family:'Inter',sans-serif;
      font-size:1rem; font-weight:700; cursor:pointer;
      box-shadow:0 4px 16px var(--blue-g);
      transition:opacity 0.2s, transform 0.15s;
    }

    .otp-verify-btn:hover  { opacity:0.9; }
    .otp-verify-btn:active { transform:scale(0.98); }

    .otp-result {
      margin-top:14px; padding:14px 18px;
      border-radius:var(--r);
      font-size:0.88rem; display:none;
    }

    .otp-result.success {
      display:block;
      background:var(--green-g);
      border:1px solid rgba(16,185,129,0.35);
      color:var(--green);
    }

    .otp-result.error {
      display:block;
      background:var(--red-g);
      border:1px solid rgba(244,63,94,0.35);
      color:var(--red);
    }

    /* ── Inbound queue ── */
    .queue-panel { padding:24px; }

    .queue-list { display:flex; flex-direction:column; gap:10px; margin-top:14px; }

    .queue-item {
      padding:14px 16px; border-radius:var(--r);
      border:1px solid var(--border);
      display:flex; align-items:center; gap:14px;
      background:rgba(255,255,255,0.02);
    }

    .queue-sev {
      width:36px; height:36px; border-radius:10px;
      display:flex; align-items:center; justify-content:center;
      font-size:0.7rem; font-weight:800; letter-spacing:0.06em;
      flex-shrink:0;
    }
    .queue-sev.RED    { background:var(--red-g);   color:var(--red); }
    .queue-sev.YELLOW { background:var(--amber-g); color:var(--amber); }
    .queue-sev.GREEN  { background:var(--green-g); color:var(--green); }

    .queue-info { flex:1; }
    .queue-otp { font-family:'JetBrains Mono',monospace; font-size:1.1rem; font-weight:700; color:var(--text-1); }
    .queue-ward { font-size:0.75rem; color:var(--text-2); margin-top:2px; }

    .queue-timer {
      font-family:'JetBrains Mono',monospace;
      font-size:0.82rem; color:var(--text-3); flex-shrink:0;
    }

    .queue-empty { text-align:center; padding:40px 0; color:var(--text-3); font-size:0.9rem; }

    /* ── Blood stock ── */
    .blood-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:14px; }

    .blood-cell {
      padding:12px; border-radius:10px; text-align:center;
      border:1px solid var(--border);
      background:rgba(255,255,255,0.02);
    }

    .blood-type { font-family:'Outfit',sans-serif; font-size:1rem; font-weight:700; color:var(--text-1); }
    .blood-units { font-size:0.72rem; color:var(--text-3); margin-top:4px; }
    .blood-bar { height:4px; border-radius:999px; background:rgba(255,255,255,0.06); overflow:hidden; margin-top:8px; }
    .blood-bar-fill { height:100%; border-radius:999px; background:var(--red); }

    /* ── Toast ── */
    .toast {
      position:fixed; bottom:24px; right:24px;
      padding:12px 20px; border-radius:var(--r);
      background:#0c1120; border:1px solid var(--border);
      color:var(--text-1); font-size:0.88rem; font-weight:500;
      box-shadow:0 8px 32px rgba(0,0,0,0.5);
      transform:translateY(8px); opacity:0;
      transition:all 0.3s;
      z-index:999;
    }
    .toast.visible { transform:translateY(0); opacity:1; }

    /* scrollbar */
    ::-webkit-scrollbar{ width:4px; }
    ::-webkit-scrollbar-track{ background:transparent; }
    ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:2px; }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════
     HEADER
════════════════════════════════════════ -->
<header class="header">
  <a href="../" class="header-logo">
    <div class="header-logo-icon">
      <svg width="16" height="16" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
        <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
      </svg>
    </div>
    PulseGrid
  </a>
  <span class="header-tag">HOSPITAL DESK</span>
  <div class="header-spacer"></div>
  <a href="../" class="citizen-link">← Citizen View</a>
</header>

<div class="page">

  <!-- TOP ROW: Hospital selector + stats -->
  <div class="top-row">

    <!-- Hospital list -->
    <div class="glass hosp-select-panel">
      <div class="panel-title">Select Hospital</div>
      <div class="hosp-list" id="hosp-list">
        <div style="color:var(--text-3); font-size:0.85rem; padding:8px;">Loading…</div>
      </div>
    </div>

    <!-- Stats + ward counters -->
    <div class="glass stats-panel" id="stats-panel">
      <div style="color:var(--text-3); font-size:0.88rem;">← Select a hospital to view its dashboard</div>
    </div>
  </div>

  <!-- BOTTOM ROW: OTP verify + Queue -->
  <div class="bottom-row">

    <!-- OTP Verify -->
    <div class="glass otp-panel">
      <div class="panel-title">Verify Patient Hold</div>
      <p style="font-size:0.82rem; color:var(--text-2); margin-bottom:4px;">
        Enter the 4-digit code the patient shows at reception to confirm their bed.
      </p>

      <div class="otp-digits">
        <input class="otp-digit" id="otp-d1" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]">
        <input class="otp-digit" id="otp-d2" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]">
        <input class="otp-digit" id="otp-d3" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]">
        <input class="otp-digit" id="otp-d4" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]">
      </div>

      <button class="otp-verify-btn" id="otp-verify-btn">✓ Verify & Admit Patient</button>

      <div class="otp-result" id="otp-result"></div>
    </div>

    <!-- Inbound queue -->
    <div class="glass queue-panel">
      <div class="panel-title">Inbound Holds</div>
      <p style="font-size:0.82rem; color:var(--text-2);">Active bed reservations at this hospital.</p>
      <div class="queue-list" id="queue-list">
        <div class="queue-empty">Select a hospital to see its queue</div>
      </div>
    </div>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ================================================================
   PulseGrid — Hospital Desk v2
   Completely separate from citizen app — no shared login
================================================================ */

/* ── API helpers ── */
const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
const BASE = isLocal ? 'http://127.0.0.1:5000' : 'https://pulsegrid-g979.onrender.com';

async function apiFetch(path, opts = {}) {
  const res = await fetch(BASE + path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  return res.json();
}

/* ── State ── */
let hospitals      = [];
let selectedHosp   = null;
let queueRefresh   = null;
let wardTimers     = {};   // ward timers for countdown display

/* ── Toast ── */
function toast(msg, isOk = true) {
  const el = document.getElementById('toast');
  el.textContent = (isOk ? '✓ ' : '⚠ ') + msg;
  el.style.borderColor = isOk ? 'rgba(16,185,129,0.35)' : 'rgba(244,63,94,0.35)';
  el.style.color        = isOk ? 'var(--green)' : 'var(--red)';
  el.classList.add('visible');
  setTimeout(() => el.classList.remove('visible'), 3500);
}

/* ── Load hospital list ── */
async function loadHospitals() {
  try {
    hospitals = await apiFetch('/api/facilities');
    renderHospList();
  } catch {
    document.getElementById('hosp-list').innerHTML =
      `<div style="color:var(--red);font-size:0.82rem;">Failed to load hospitals.<br>Is the backend running?</div>`;
  }
}

function renderHospList() {
  const el = document.getElementById('hosp-list');
  el.innerHTML = '';
  hospitals.forEach(h => {
    const isGovt = (h.type || '').toLowerCase().includes('gov');
    const item = document.createElement('div');
    item.className = 'hosp-item';
    item.dataset.id = h.id;
    item.innerHTML = `
      <div class="hosp-item-name">${h.name}</div>
      <span class="hosp-item-type ${isGovt?'govt':'pvt'}">${isGovt?'Government':'Private'}</span>`;
    item.addEventListener('click', () => selectHospital(h));
    el.appendChild(item);
  });
}

/* ── Compute staffed available (no ghost beds) ── */
function avail(ward) {
  return Math.max(0, (ward.total || 0) - (ward.occupied || 0) - (ward.held || 0));
}

/* ── Select hospital ── */
function selectHospital(h) {
  selectedHosp = h;

  // Highlight in list
  document.querySelectorAll('.hosp-item').forEach(el =>
    el.classList.toggle('selected', el.dataset.id === h.id));

  renderStats(h);
  refreshQueue();

  // Auto-refresh queue every 20s
  clearInterval(queueRefresh);
  queueRefresh = setInterval(refreshQueue, 20000);
}

/* ── Render ward stats ── */
function renderStats(h) {
  const el = document.getElementById('stats-panel');
  const wardDefs = [
    { key: 'adult_icu',     display: 'Adult ICU',     icon:'🏥' },
    { key: 'pediatric_icu', display: 'Pediatric ICU', icon:'👶' },
    { key: 'cardiac_icu',   display: 'Cardiac ICU',   icon:'❤️' },
    { key: 'general_ward',  display: 'General Ward',  icon:'🛏' },
  ];

  const wardCards = wardDefs.map(def => {
    const ward = h.wards ? h.wards[def.display] || {} : {};
    const a    = avail(ward);
    const pct  = ward.total > 0 ? Math.round((ward.occupied + ward.held) / ward.total * 100) : 0;
    const color = pct >= 95 ? 'var(--red)' : pct >= 75 ? 'var(--amber)' : 'var(--green)';

    return `
    <div class="ward-card">
      <div class="ward-card-name">${def.icon} ${def.display}</div>
      <div>
        <div class="ward-avail-count" style="color:${color}">${a}</div>
        <div class="ward-avail-label">staffed beds free of ${ward.total || 0}</div>
      </div>
      <div class="ward-bar-track">
        <div class="ward-bar-fill" style="width:${pct}%; background:${color};"></div>
      </div>
      <div class="ward-adj">
        <span class="adj-info">${ward.occupied || 0} occ. / ${ward.held || 0} held</span>
        <div class="adj-btns">
          <button class="adj-btn minus" data-ward="${def.key}" data-delta="-1">−</button>
          <button class="adj-btn plus"  data-ward="${def.key}" data-delta="1">+</button>
        </div>
      </div>
    </div>`;
  }).join('');

  const blood = h.blood_stock_summary || {};
  const bloodCells = Object.entries(blood).map(([t,v]) => {
    const pct = Math.min(100, v * 4); // max ~25 units = full
    return `
      <div class="blood-cell">
        <div class="blood-type">${t}</div>
        <div class="blood-units">${v} units</div>
        <div class="blood-bar"><div class="blood-bar-fill" style="width:${pct}%"></div></div>
      </div>`;
  }).join('');

  el.innerHTML = `
    <div class="hosp-header-name">${h.name}</div>
    <div class="hosp-header-address">${h.address} &nbsp;|&nbsp; 📞 ${h.emergency_phone || h.phone}</div>
    <div class="wards-grid">${wardCards}</div>
    <div class="panel-title">Blood Stock</div>
    <div class="blood-grid">${bloodCells}</div>`;

  // Wire up +/- buttons
  el.querySelectorAll('.adj-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      adjustWard(h.id, btn.dataset.ward, parseInt(btn.dataset.delta));
    });
  });
}

/* ── Adjust ward count ── */
async function adjustWard(hospId, ward, delta) {
  try {
    const res = await apiFetch('/api/counter', {
      method: 'POST',
      body: JSON.stringify({ hospital_id: hospId, ward, delta }),
    });
    if (res.error) { toast(res.error, false); return; }
    toast(`${ward.replace('_',' ')} updated by ${delta > 0 ? '+' : ''}${delta}`);
    // Refresh hospital data
    hospitals = await apiFetch('/api/facilities');
    const fresh = hospitals.find(h => h.id === hospId);
    if (fresh) { selectedHosp = fresh; renderStats(fresh); }
  } catch {
    toast('Update failed — check connection', false);
  }
}

/* ── Refresh inbound queue ── */
async function refreshQueue() {
  if (!selectedHosp) return;
  try {
    const holds = await apiFetch(`/api/holds/${selectedHosp.id}`);
    renderQueue(holds);
  } catch {
    document.getElementById('queue-list').innerHTML =
      `<div class="queue-empty" style="color:var(--red);">Could not load queue</div>`;
  }
}

function renderQueue(holds) {
  const el = document.getElementById('queue-list');
  if (!holds || !holds.length) {
    el.innerHTML = `<div class="queue-empty">No active holds at this time 🎉</div>`;
    return;
  }

  el.innerHTML = holds.map(hold => {
    const expires = new Date(hold.expires_at);
    const minsLeft = Math.max(0, Math.round((expires - Date.now()) / 60000));
    const sev = hold.severity || 'YELLOW';
    return `
    <div class="queue-item">
      <div class="queue-sev ${sev}">${sev}</div>
      <div class="queue-info">
        <div class="queue-otp">${hold.otp_code}</div>
        <div class="queue-ward">${hold.resource_type?.replace(/_/g,' ')} — ${hold.hold_type}</div>
      </div>
      <div class="queue-timer">${minsLeft}m left</div>
    </div>`;
  }).join('');
}

/* ── OTP verification ── */
const digits = ['otp-d1','otp-d2','otp-d3','otp-d4'];

// Auto-advance between digit inputs
digits.forEach((id, i) => {
  const el = document.getElementById(id);
  el.addEventListener('input', () => {
    el.value = el.value.replace(/\D/g,'').slice(-1);
    if (el.value && i < digits.length - 1) {
      document.getElementById(digits[i+1]).focus();
    }
  });
  el.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && !el.value && i > 0) {
      document.getElementById(digits[i-1]).focus();
    }
  });
});

document.getElementById('otp-verify-btn').addEventListener('click', async () => {
  const otp = digits.map(id => document.getElementById(id).value).join('');
  if (otp.length < 4) { toast('Enter all 4 digits', false); return; }
  if (!selectedHosp)  { toast('Select a hospital first', false); return; }

  const resultEl = document.getElementById('otp-result');
  resultEl.style.display = 'none';

  try {
    const res = await apiFetch('/api/redeem', {
      method: 'POST',
      body: JSON.stringify({ hospital_id: selectedHosp.id, otp_code: otp }),
    });

    if (res.error) {
      resultEl.className = 'otp-result error';
      resultEl.textContent = '✗ ' + res.error;
    } else {
      resultEl.className = 'otp-result success';
      resultEl.textContent = `✓ Patient admitted — ${res.resource_type?.replace(/_/g,' ')} bed confirmed.`;
      // Clear inputs
      digits.forEach(id => { document.getElementById(id).value = ''; });
      document.getElementById('otp-d1').focus();
      refreshQueue();
    }
  } catch {
    resultEl.className = 'otp-result error';
    resultEl.textContent = '✗ Network error. Try again.';
  }
  resultEl.style.display = 'block';
});

/* ── Boot ── */
loadHospitals();
</script>
</body>
</html>
