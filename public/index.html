<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>PulseGrid — Emergency Bed & Blood Triage | Kolkata</title>
<meta name="description" content="Real-time emergency hospital bed finder with AI triage, 15-minute GPS soft-lock, and instant routing for Kolkata."/>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>

<!-- Leaflet CSS — CDN ONLY. Do NOT use local leaflet.css. Do NOT override .leaflet-tile rules. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>

<style>
/* ═══════════════════════════════════════════════════════
   PULSEGRID — INDIAN TRICOLOR DESIGN SYSTEM
   Saffron: #FF6B35 | White: #FFFFFF | Green: #138808
═══════════════════════════════════════════════════════ */
:root {
  --saffron: #FF6B35;
  --saffron-light: #FF8C5A;
  --saffron-dark: #E5541A;
  --green: #138808;
  --green-light: #1AAD0A;
  --green-dark: #0D6B06;
  --white: #FFFFFF;
  --bg: #F7F8FA;
  --surface: #FFFFFF;
  --surface2: #F0F2F5;
  --border: #E4E7EC;
  --text-primary: #0A0A0A;
  --text-secondary: #4B5563;
  --text-muted: #9CA3AF;
  --red-alert: #DC2626;
  --yellow-alert: #D97706;
  --shadow: 0 4px 24px rgba(0,0,0,0.1);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.15);
  --radius: 16px;
  --radius-sm: 10px;
  --radius-pill: 999px;
}
[data-theme="dark"] {
  --bg: #0A0A0A;
  --surface: #141414;
  --surface2: #1E1E1E;
  --border: #2A2A2A;
  --text-primary: #F5F5F5;
  --text-secondary: #9CA3AF;
  --text-muted: #4B5563;
  --shadow: 0 4px 24px rgba(0,0,0,0.6);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.8);
}

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html,body { width:100%; height:100%; overflow:hidden; font-family:'Inter',sans-serif; background:var(--bg); color:var(--text-primary); -webkit-font-smoothing:antialiased; }

/* ── Map (CRITICAL: let Leaflet own this completely) ── */
#app { position:fixed; inset:0; width:100%; height:100%; overflow:hidden; max-width:430px; margin:0 auto; }
#map-wrap { position:absolute; inset:0; width:100%; height:100%; }
#map { width:100%; height:100%; position:relative; background:#e8e8e8; }

/* ── Location Bar ── */
#location-bar {
  position:absolute; top:12px; left:12px; right:12px; z-index:600;
  display:flex; align-items:center; gap:8px;
}
#loc-pill {
  flex:1; min-width:0; display:flex; align-items:center; gap:8px;
  background:var(--surface); border:1.5px solid var(--border);
  border-radius:var(--radius-pill); padding:8px 14px;
  box-shadow:var(--shadow); cursor:pointer;
  transition:border-color .2s, box-shadow .2s;
}
#loc-pill:hover { border-color:var(--saffron); box-shadow:0 0 0 3px rgba(255,107,53,.15); }
.loc-pin-icon { color:var(--saffron); flex-shrink:0; }
.loc-label { font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--saffron); flex-shrink:0; }
.loc-address { font-size:11px; font-weight:500; color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; }
.loc-change-btn { font-size:9px; font-weight:700; color:var(--saffron); background:rgba(255,107,53,.08); border:1px solid rgba(255,107,53,.3); border-radius:var(--radius-pill); padding:3px 10px; white-space:nowrap; flex-shrink:0; }
#gps-btn, #theme-btn {
  width:38px; height:38px; border-radius:50%; background:var(--surface); border:1.5px solid var(--border);
  box-shadow:var(--shadow); cursor:pointer; display:flex; align-items:center; justify-content:center;
  color:var(--saffron); transition:all .2s; flex-shrink:0;
}
#gps-btn:hover, #theme-btn:hover { background:var(--saffron); color:#fff; border-color:var(--saffron); }

/* ── Active Hold Banner ── */
#hold-banner {
  position:absolute; top:64px; left:12px; right:12px; z-index:590;
  background:linear-gradient(135deg, var(--green) 0%, #0D9E05 100%);
  border-radius:var(--radius); padding:10px 14px;
  display:flex; align-items:flex-start; gap:10px;
  box-shadow:0 4px 20px rgba(19,136,8,.35);
  animation:slideDown .3s cubic-bezier(.16,1,.3,1);
}
#hold-banner.hidden { display:none; }
.hold-check { width:28px; height:28px; background:rgba(255,255,255,.2); border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.hold-banner-text { flex:1; min-width:0; }
.hold-banner-title { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:#fff; margin-bottom:1px; }
.hold-banner-sub { font-size:12px; font-weight:600; color:rgba(255,255,255,.9); }
.hold-banner-otp { font-size:10px; color:rgba(255,255,255,.75); margin-top:2px; }
#hold-banner-close { color:rgba(255,255,255,.7); cursor:pointer; padding:2px; flex-shrink:0; }

/* ── Search Bar ── */
#search-bar {
  position:absolute; bottom:16px; left:12px; right:12px; z-index:600;
  display:flex; align-items:center; gap:8px;
  background:var(--surface); border:1.5px solid var(--border);
  border-radius:var(--radius-pill); padding:10px 14px;
  box-shadow:var(--shadow-lg); transition:all .3s;
}
#search-bar.active { border-color:var(--saffron); box-shadow:0 0 0 3px rgba(255,107,53,.15); }
#search-bar.hidden { transform:translateY(100px); opacity:0; pointer-events:none; }
.search-icon-wrap { color:var(--saffron); flex-shrink:0; }
#symptom-input {
  flex:1; border:none; outline:none; background:transparent;
  font-size:13px; font-weight:500; color:var(--text-primary);
  font-family:'Inter',sans-serif;
}
#symptom-input::placeholder { color:var(--text-muted); }
#search-submit-btn {
  width:32px; height:32px; border-radius:50%; background:var(--saffron); border:none;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  color:#fff; transition:all .2s; flex-shrink:0;
}
#search-submit-btn:hover { background:var(--saffron-dark); transform:scale(1.05); }
#search-clear-btn, #lang-btn, #mic-btn {
  background:none; border:none; cursor:pointer; padding:4px;
  color:var(--text-muted); flex-shrink:0; transition:color .2s;
}
#search-clear-btn:hover, #lang-btn:hover { color:var(--text-secondary); }
#mic-btn { color:var(--saffron); }
#mic-btn.listening { animation:pulse-mic 1s infinite; }
@keyframes pulse-mic { 0%,100%{opacity:1} 50%{opacity:.4} }

/* ── Map Recenter FAB ── */
#recenter-fab {
  position:absolute; right:14px; bottom:80px; z-index:590;
  width:40px; height:40px; border-radius:50%;
  background:var(--surface); border:1.5px solid var(--border);
  box-shadow:var(--shadow); cursor:pointer; display:flex; align-items:center; justify-content:center;
  color:var(--saffron); transition:all .2s;
}
#recenter-fab:hover { background:var(--saffron); color:#fff; }

/* ── Hospital Quick Cards (no active search) ── */
#quick-cards {
  position:absolute; bottom:72px; left:0; right:0; z-index:580;
  display:flex; gap:10px; padding:0 12px;
  overflow-x:auto; scrollbar-width:none;
  transition:all .3s;
}
#quick-cards.hidden { display:none; }
#quick-cards::-webkit-scrollbar { display:none; }
.quick-card {
  flex-shrink:0; background:var(--surface); border:1.5px solid var(--border);
  border-radius:var(--radius); padding:12px 14px; cursor:pointer;
  box-shadow:var(--shadow); min-width:160px; transition:all .2s;
  display:flex; flex-direction:column; gap:4px;
}
.quick-card:hover { border-color:var(--saffron); box-shadow:0 4px 20px rgba(255,107,53,.2); }
.qc-tag { font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; }
.qc-tag.govt { color:var(--green); }
.qc-tag.private { color:var(--saffron); }
.qc-name { font-size:12px; font-weight:700; color:var(--text-primary); line-height:1.2; }
.qc-meta { display:flex; gap:8px; align-items:center; }
.qc-beds { font-size:11px; font-weight:600; color:var(--green); }
.qc-eta { font-size:10px; color:var(--text-muted); }

/* ── Bottom Drawer ── */
#drawer {
  position:absolute; bottom:0; left:0; right:0; z-index:700;
  background:var(--surface); border-radius:28px 28px 0 0;
  border-top:1.5px solid var(--border); border-left:1.5px solid var(--border); border-right:1.5px solid var(--border);
  box-shadow:0 -12px 40px rgba(0,0,0,.15);
  display:flex; flex-direction:column;
  height:32vh; max-height:78vh;
  transition:height .35s cubic-bezier(.16,1,.3,1);
  overflow:hidden;
}
#drawer.hidden { transform:translateY(100%); opacity:0; pointer-events:none; transition:transform .3s, opacity .2s; }
#drawer.expanded { height:76vh; }
#drawer-handle-area {
  padding:10px 0 6px; flex-shrink:0; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.drawer-handle { width:40px; height:4px; border-radius:4px; background:var(--border); }
#drawer-scroll { flex:1; overflow-y:auto; padding:0 14px 16px; overscroll-behavior:contain; }
#drawer-scroll::-webkit-scrollbar { display:none; }

/* Drawer Header */
.dr-header { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:8px; }
.dr-name { font-size:17px; font-weight:900; text-transform:uppercase; font-style:italic; color:var(--text-primary); line-height:1.15; flex:1; min-width:0; }
.dr-corridor { font-size:11px; color:var(--saffron); font-weight:500; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dr-pills { display:flex; gap:6px; align-items:center; flex-shrink:0; }
.dr-pill { font-size:10px; font-weight:700; padding:4px 8px; border-radius:8px; white-space:nowrap; }
.dr-pill-eta { background:rgba(255,107,53,.1); color:var(--saffron); border:1px solid rgba(255,107,53,.25); }
.dr-pill-dist { background:var(--surface2); color:var(--text-secondary); border:1px solid var(--border); }
.dr-close-btn { width:28px; height:28px; border-radius:8px; background:var(--surface2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-muted); flex-shrink:0; }

/* Drawer Tabs */
.dr-tabs { display:flex; gap:6px; margin-bottom:10px; }
.dr-tab {
  flex:1; padding:8px; border-radius:10px; border:1.5px solid var(--border);
  background:var(--surface2); cursor:pointer; font-size:11px; font-weight:700;
  color:var(--text-secondary); text-align:center; transition:all .2s;
  display:flex; align-items:center; justify-content:center; gap:5px;
}
.dr-tab.active-govt { background:rgba(19,136,8,.08); border-color:var(--green); color:var(--green); }
.dr-tab.active-private { background:rgba(255,107,53,.08); border-color:var(--saffron); color:var(--saffron); }
.dr-tag { font-size:9px; font-weight:600; padding:2px 6px; border-radius:4px; background:var(--surface2); }

/* Tags Row */
.dr-tags { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.badge { font-size:9px; font-weight:700; text-transform:uppercase; padding:3px 8px; border-radius:6px; }
.badge-red { background:rgba(220,38,38,.1); color:#DC2626; border:1px solid rgba(220,38,38,.25); }
.badge-green { background:rgba(19,136,8,.1); color:var(--green); border:1px solid rgba(19,136,8,.25); }
.badge-orange { background:rgba(255,107,53,.1); color:var(--saffron); border:1px solid rgba(255,107,53,.25); }
.badge-blue { background:rgba(59,130,246,.1); color:#2563EB; border:1px solid rgba(59,130,246,.25); }
.badge-gray { background:var(--surface2); color:var(--text-secondary); border:1px solid var(--border); }
.badge-yellow { background:rgba(217,119,6,.1); color:#D97706; border:1px solid rgba(217,119,6,.25); }

/* Hold Active Card */
.hold-active-card {
  background:rgba(19,136,8,.06); border:2px solid var(--green);
  border-radius:var(--radius); padding:12px; margin-bottom:12px;
}
.hold-card-top { display:flex; align-items:center; justify-content:space-between; padding-bottom:8px; border-bottom:1px solid rgba(19,136,8,.15); margin-bottom:8px; }
.hold-pulse-dot { position:relative; width:10px; height:10px; margin-right:6px; }
.hold-pulse-dot::before { content:''; position:absolute; inset:0; border-radius:50%; background:var(--green); animation:ping 1.2s cubic-bezier(0,.2,.8,1) infinite; opacity:.6; }
.hold-pulse-dot::after { content:''; position:absolute; inset:1px; border-radius:50%; background:var(--green); }
@keyframes ping { 0%{transform:scale(1);opacity:.75} 75%,100%{transform:scale(2);opacity:0} }
.hold-timer { font-family:'Inter',monospace; font-size:18px; font-weight:900; color:var(--text-primary); }
.hold-gps-tag { font-size:8px; font-weight:700; color:var(--green); text-transform:uppercase; }
.otp-display { display:flex; align-items:center; justify-content:space-between; background:var(--surface2); border-radius:10px; padding:10px 12px; }
.otp-label-block { display:flex; flex-direction:column; gap:1px; }
.otp-label { font-size:8px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); }
.otp-hint { font-size:9px; color:var(--green); font-weight:600; }
.otp-digits { display:flex; gap:4px; align-items:center; }
.otp-digit { width:26px; height:34px; background:var(--surface); border:1px solid var(--border); border-radius:8px; display:flex; align-items:center; justify-content:center; font-family:'Inter',monospace; font-size:15px; font-weight:900; color:var(--text-primary); }
.otp-copy-btn { margin-left:6px; padding:6px; border-radius:8px; background:var(--surface); border:1px solid var(--border); cursor:pointer; color:var(--saffron); transition:all .2s; }
.otp-copy-btn:hover { background:var(--saffron); color:#fff; }

/* Book Button */
.book-btn {
  width:100%; padding:14px; border-radius:var(--radius); border:none;
  background:linear-gradient(135deg, var(--saffron) 0%, var(--saffron-dark) 100%);
  color:#fff; font-size:14px; font-weight:800; text-transform:uppercase; letter-spacing:.04em;
  cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  transition:all .2s; box-shadow:0 4px 16px rgba(255,107,53,.35);
  margin-bottom:8px;
}
.book-btn:hover { transform:translateY(-1px); box-shadow:0 6px 24px rgba(255,107,53,.45); }
.book-btn:active { transform:scale(.98); }

/* Action Row */
.action-row { display:flex; gap:8px; margin-bottom:12px; }
.action-btn {
  flex:1; padding:11px; border-radius:var(--radius-sm); border:1.5px solid var(--border);
  background:var(--surface2); cursor:pointer; font-size:11px; font-weight:700;
  color:var(--text-secondary); display:flex; align-items:center; justify-content:center; gap:6px;
  transition:all .2s;
}
.action-btn.ambulance:hover { background:rgba(220,38,38,.08); border-color:#DC2626; color:#DC2626; }
.action-btn.call:hover { background:rgba(19,136,8,.08); border-color:var(--green); color:var(--green); }
.action-btn.release:hover { background:rgba(220,38,38,.08); border-color:#DC2626; color:#DC2626; }

/* Clinical Assessment Section */
.section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.section-title { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--text-secondary); display:flex; align-items:center; gap:6px; }
.triage-live-tag { font-size:9px; font-weight:700; color:var(--saffron); background:rgba(255,107,53,.08); border:1px solid rgba(255,107,53,.2); padding:2px 8px; border-radius:6px; }
.triage-card { background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; margin-bottom:8px; }
.triage-title { font-size:12px; font-weight:800; color:var(--saffron); margin-bottom:4px; }
.triage-body { font-size:11px; color:var(--text-secondary); line-height:1.55; }
.protocol-btn { width:100%; padding:10px; border-radius:var(--radius-sm); border:1.5px solid var(--saffron); background:rgba(255,107,53,.06); color:var(--saffron); font-size:11px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; transition:all .2s; margin-bottom:10px; }
.protocol-btn:hover { background:var(--saffron); color:#fff; }

/* Ward Breakdown */
.ward-breakdown { border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden; margin-bottom:10px; }
.ward-breakdown-header { background:var(--surface2); padding:8px 12px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-secondary); display:flex; justify-content:space-between; }
.ward-row { display:flex; align-items:center; justify-content:space-between; padding:8px 12px; border-top:1px solid var(--border); }
.ward-row-name { font-size:11px; font-weight:600; color:var(--text-primary); }
.ward-row-meta { font-size:10px; color:var(--text-muted); }
.ward-row-free { font-size:12px; font-weight:800; }
.ward-row-free.has-beds { color:var(--green); }
.ward-row-free.no-beds { color:#DC2626; }

/* Stats Row */
.stats-row { display:flex; gap:6px; margin-bottom:10px; }
.stat-card { flex:1; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 8px; text-align:center; }
.stat-val { font-size:16px; font-weight:900; color:var(--text-primary); }
.stat-val.green { color:var(--green); }
.stat-val.orange { color:var(--saffron); }
.stat-label { font-size:9px; text-transform:uppercase; font-weight:600; color:var(--text-muted); margin-top:2px; }

/* Protocol Full Sheet */
#protocol-sheet {
  position:absolute; inset:0; z-index:800;
  background:var(--bg); overflow-y:auto;
  animation:slideUp .3s cubic-bezier(.16,1,.3,1);
}
#protocol-sheet.hidden { display:none; }
.proto-header { position:sticky; top:0; background:var(--surface); border-bottom:1px solid var(--border); padding:14px 16px; display:flex; align-items:center; gap:10px; z-index:1; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.proto-close { width:32px; height:32px; border-radius:8px; background:var(--surface2); border:1px solid var(--border); cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--text-muted); }
.proto-title { font-size:14px; font-weight:800; color:var(--text-primary); flex:1; }
.proto-severity { font-size:10px; font-weight:800; padding:4px 12px; border-radius:var(--radius-pill); }
.proto-severity.red { background:rgba(220,38,38,.1); color:#DC2626; border:1px solid rgba(220,38,38,.3); }
.proto-severity.yellow { background:rgba(217,119,6,.1); color:#D97706; border:1px solid rgba(217,119,6,.3); }
.proto-severity.green { background:rgba(19,136,8,.1); color:var(--green); border:1px solid rgba(19,136,8,.3); }
.proto-body { padding:16px; }
.proto-section { margin-bottom:20px; }
.proto-section-title { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.07em; color:var(--text-muted); margin-bottom:8px; display:flex; align-items:center; gap:6px; }
.proto-section-title::before { content:''; display:block; width:3px; height:12px; background:var(--saffron); border-radius:2px; }
.proto-section-box { background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; }
.proto-section-box p { font-size:12px; color:var(--text-secondary); line-height:1.6; }
.proto-hospitals { display:flex; gap:8px; }
.proto-hosp-card { flex:1; background:var(--surface2); border:1.5px solid var(--border); border-radius:var(--radius-sm); padding:12px; cursor:pointer; transition:all .2s; }
.proto-hosp-card:hover { border-color:var(--saffron); }
.proto-hosp-card.govt-card:hover { border-color:var(--green); }
.proto-hosp-tag { font-size:9px; font-weight:700; text-transform:uppercase; display:flex; align-items:center; gap:4px; margin-bottom:4px; }
.proto-hosp-name { font-size:12px; font-weight:800; color:var(--text-primary); line-height:1.2; margin-bottom:4px; }
.proto-hosp-meta { font-size:10px; color:var(--text-muted); }
.proto-select-btn { width:100%; margin-top:8px; padding:7px; border-radius:8px; border:none; font-size:10px; font-weight:700; cursor:pointer; transition:all .2s; }
.proto-select-btn.govt { background:rgba(19,136,8,.1); color:var(--green); }
.proto-select-btn.private { background:rgba(255,107,53,.1); color:var(--saffron); }
.proto-do-now { background:rgba(255,107,53,.06); border:1px solid rgba(255,107,53,.2); border-radius:var(--radius-sm); padding:12px; margin-bottom:8px; }
.proto-do-now-label { font-size:9px; font-weight:800; text-transform:uppercase; color:var(--saffron); letter-spacing:.05em; margin-bottom:4px; }
.proto-do-now-text { font-size:12px; font-weight:700; color:var(--text-primary); }
.proto-steps-list { list-style:none; display:flex; flex-direction:column; gap:6px; }
.proto-step { display:flex; gap:8px; }
.proto-step-num { width:20px; height:20px; border-radius:50%; background:var(--saffron); color:#fff; font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

// ── AI Triage Classifier (ported from triageClassifier.ts) ─
function classifyEmergency(query) {
  const q = (query||'').toLowerCase().trim();
  const bloodMatch = q.match(/\b(o-|o\+|a-|a\+|b-|b\+|ab-|ab\+)\b/i);
  const bloodKeyword = q.includes('blood')||q.includes('prbc')||q.includes('platelet')||q.includes('plasma')||q.includes('rokto')||q.includes('khoon');
  let bloodNeeded = null;
  if(bloodMatch||bloodKeyword) bloodNeeded={group:bloodMatch?bloodMatch[1].toUpperCase():'O-',component:q.includes('platelet')?'PLATELETS':q.includes('plasma')?'PLASMA':'PRBC'};

  const isNegated=q.includes('no chest pain')||q.includes('not breathless')||q.includes('fine now')||q.includes('normal');
  if(isNegated&&!q.includes('severe')&&!q.includes('unresponsive')) return{severity:'GREEN',ward:'general_oxygen',protocol:'respiratory',keywords:['ruled out'],score:15,explanation:'No critical flags detected. Safe for outpatient evaluation.',offer_hold:false};

  if(q.includes('cardiac arrest')||q.includes('no pulse')||q.includes('stopped breathing')||q.includes('unresponsive')||q.includes('cpr')||q.includes('collapsed')||q.includes('behosh')||q.includes('behoshi'))
    return{severity:'RED',ward:'adult_icu',protocol:'arrest',keywords:['cardiac arrest','no pulse'],score:100,explanation:'Loss of responsiveness requires immediate CPR & Level-1 Resuscitation Bay.',offer_hold:true,blood:bloodNeeded};

  if(q.includes('chest pain')||q.includes('heart attack')||q.includes('angina')||q.includes('cardiac')||q.includes('left arm pain')||q.includes('jaw pain')||q.includes('seene mein')||q.includes('chhati'))
    return{severity:'RED',ward:'cardiac_icu',protocol:'cardiac',keywords:['chest pain','cardiac symptoms'],score:95,explanation:'Acute coronary syndrome. Requires urgent Cath Lab & Cardiac ICU monitored bed.',offer_hold:true,blood:bloodNeeded};

  if(q.includes('stroke')||q.includes('paralysis')||q.includes('face droop')||q.includes('slurred speech')||q.includes('arm weakness')||q.includes('brain attack'))
    return{severity:'RED',ward:'adult_icu',protocol:'stroke',keywords:['stroke','FAST positive'],score:95,explanation:'Acute neurological deficit within thrombolysis window. Emergency CT Brain priority.',offer_hold:true,blood:bloodNeeded};

  if(q.includes('bleeding')||q.includes('blood loss')||q.includes('accident')||q.includes('stab')||q.includes('trauma')||q.includes('khoon')||q.includes('rokto'))
    return{severity:'RED',ward:'adult_icu',protocol:'trauma',keywords:['arterial bleeding','trauma shock'],score:90,explanation:'Critical vascular compromise. Massive Transfusion Protocol (MTP) alerted.',offer_hold:true,blood:bloodNeeded||{group:'O-',component:'PRBC'}};

  if(q.includes('child')||q.includes('baby')||q.includes('baccha')||q.includes('pediatric')||q.includes('shishu'))
    return{severity:'RED',ward:'pediatric_icu',protocol:'pediatric',keywords:['pediatric emergency'],score:88,explanation:'Pediatric urgent distress. Auto-routed to dedicated Pediatric ICU.',offer_hold:true,blood:bloodNeeded};

  if(q.includes('asthma')||q.includes('breathless')||q.includes('breathing')||q.includes('shortness of breath')||q.includes('wheezing')||q.includes('oxygen')||q.includes('choking')||q.includes('saans'))
    return{severity:'RED',ward:'general_oxygen',protocol:'respiratory',keywords:['respiratory distress','hypoxia'],score:85,explanation:'Acute airway constriction. High-flow oxygen & continuous SpO2 monitoring required.',offer_hold:true,blood:bloodNeeded};

  if(q.includes('burn')||q.includes('fire')||q.includes('scald')||q.includes('acid')||q.includes('electrocution'))
    return{severity:'RED',ward:'adult_icu',protocol:'burn',keywords:['thermal injury','burns'],score:85,explanation:'Thermal shock risk. Fluid resuscitation (Parkland formula) in sterile burn bay required.',offer_hold:true,blood:bloodNeeded};

  if(q.includes('fracture')||q.includes('broken bone')||q.includes('dislocation')||q.includes('fall from height'))
    return{severity:'YELLOW',ward:'adult_icu',protocol:'trauma',keywords:['orthopedic trauma'],score:75,explanation:'Acute skeletal trauma requiring X-ray, neurovascular check, and limb splinting.',offer_hold:true,blood:bloodNeeded};

  if(q.includes('pregnancy')||q.includes('pregnant')||q.includes('labor')||q.includes('delivery')||q.includes('contractions'))
    return{severity:'RED',ward:'general_oxygen',protocol:'maternity',keywords:['active labor','obstetric emergency'],score:88,explanation:'Active labor. Emergency delivery suite with neonatal resuscitation prep required.',offer_hold:true,blood:bloodNeeded};

  if(q.includes('snake')||q.includes('poison')||q.includes('overdose')||q.includes('toxic'))
    return{severity:'RED',ward:'adult_icu',protocol:'arrest',keywords:['toxic ingestion'],score:92,explanation:'Acute toxidrome. Immediate antivenom/gastric lavage & ICU monitoring required.',offer_hold:true,blood:bloodNeeded};

  if(bloodNeeded)
    return{severity:'YELLOW',ward:'adult_icu',protocol:'trauma',keywords:[`Blood ${bloodNeeded.group}`,'transfusion'],score:80,explanation:`Immediate transfusion need for group ${bloodNeeded.group}. Filtering crossmatched hospitals.`,offer_hold:true,blood:bloodNeeded};

  if(q.includes('nearest')||q.includes('hospital')||q.includes('emergency')||q.includes('doctor'))
    return{severity:'YELLOW',ward:'adult_icu',protocol:'cardiac',keywords:['closest emergency'],score:70,explanation:'Proximity-optimized routing to nearest hospital with 24/7 emergency triage.',offer_hold:true};

  return{severity:'YELLOW',ward:'adult_icu',protocol:'cardiac',keywords:['acute symptoms'],score:70,explanation:'Clinical symptoms require urgent bedside assessment and diagnostic imaging.',offer_hold:true,blood:bloodNeeded};
}

// ── Distance Utils ─────────────────────────────────────────
function haversineKm(lat1,lng1,lat2,lng2) {
  const R=6371, dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function etaMin(km) { return Math.max(1,Math.round(km/0.35)); }

// ── Recompute ETAs ─────────────────────────────────────────
function recomputeHospitals() {
  hospitals = hospitals.map(h=>{
    const km=haversineKm(userLat,userLng,h.lat,h.lng);
    return {...h,distance_km:+km.toFixed(1),eta_minutes:etaMin(km)};
  });
  hospitals.sort((a,b)=>a.eta_minutes-b.eta_minutes);
}

// ── Map Init ──────────────────────────────────────────────
function initMap() {
  if(typeof L==='undefined'){setTimeout(initMap,200);return;}
  const mapEl=document.getElementById('map');
  map=L.map(mapEl,{center:[userLat,userLng],zoom:16,zoomControl:false,attributionControl:false});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OSM'}).addTo(map);
  // Critical: invalidate after layout settles
  setTimeout(()=>map.invalidateSize(),50);
  setTimeout(()=>map.invalidateSize(),300);
  if(typeof ResizeObserver!=='undefined') new ResizeObserver(()=>map.invalidateSize()).observe(mapEl);
  window.addEventListener('resize',()=>map.invalidateSize());
  placeUserMarker();
  placeHospitalMarkers();
  updateQuickCards();
}

// ── GPS & Location ────────────────────────────────────────
function requestGPS() {
  if(isLocating)return;
  isLocating=true;
  const btn=document.getElementById('gps-btn');
  btn.style.animation='spin .8s linear infinite';
  if(!navigator.geolocation){isLocating=false;btn.style.animation='';return;}
  navigator.geolocation.getCurrentPosition(pos=>{
    userLat=pos.coords.latitude; userLng=pos.coords.longitude;
    isLocating=false; btn.style.animation='';
    recomputeHospitals();
    placeUserMarker();
    placeHospitalMarkers();
    updateQuickCards();
    if(map) map.setView([userLat,userLng],16,{animate:true});
    reverseGeocode(userLat,userLng).then(addr=>{
      userAddress=addr||`${userLat.toFixed(4)}, ${userLng.toFixed(4)}`;
      document.getElementById('loc-address').textContent=userAddress;
      localStorage.setItem('pg_loc',JSON.stringify({lat:userLat,lng:userLng,addr:userAddress}));
    });
  },err=>{
    console.warn('GPS error',err);
    isLocating=false; btn.style.animation='';
    userAddress='Rodkol Rd, Nagerbazar, Kolkata';
    document.getElementById('loc-address').textContent=userAddress;
  },{enableHighAccuracy:true,timeout:6000,maximumAge:60000});
}

async function reverseGeocode(lat,lng) {
  try {
    const res=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=16`,{headers:{'Accept-Language':'en'},signal:AbortSignal.timeout?AbortSignal.timeout(4000):undefined});
    if(res.ok){const d=await res.json();if(d.display_name)return d.display_name.split(',').slice(0,3).map(s=>s.trim()).join(', ');}
  }catch{}return null;
}

function recenterMap() {

}

  document.getElementById('search-submit-btn').style.display=v?'flex':'none';
  currentQuery=v;
  if(!v&&isSearchActive) clearSearch();
});

function submitSearch() {
  const q=searchInput.value.trim();
  if(!q)return;
  currentQuery=q;
  classification=classifyEmergency(q);
  isSearchActive=true;
  document.getElementById('search-bar').classList.add('active');
  document.getElementById('quick-cards').classList.add('hidden');
  sortAndSelectHospital();
}

function sortAndSelectHospital() {
  hospitals=hospitals.map(h=>{
    const km=haversineKm(userLat,userLng,h.lat,h.lng);
    return{...h,distance_km:+km.toFixed(1),eta_minutes:etaMin(km)};
  });
  if(classification.severity==='RED') {
    hospitals.sort((a,b)=>{
      const aw=a.wards.find(w=>w.ward_code===classification.ward);
      const bw=b.wards.find(w=>w.ward_code===classification.ward);
      const aHas=(aw?.available_now||0)>0, bHas=(bw?.available_now||0)>0;
      if(aHas&&!bHas)return-1; if(!aHas&&bHas)return 1;
      return a.eta_minutes-b.eta_minutes;
    });
  } else hospitals.sort((a,b)=>a.eta_minutes-b.eta_minutes);
  selectHospital(hospitals[0]);
  placeHospitalMarkers();
}

function clearSearch() {
  currentQuery=''; isSearchActive=false;
  searchInput.value='';
  document.getElementById('search-clear-btn').style.display='none';
  document.getElementById('search-submit-btn').style.display='none';
  document.getElementById('search-bar').classList.remove('active');

    map.fitBounds(bounds.pad(.25),{animate:true});
  }
}

}

// ── Route Drawing (OSRM) ──────────────────────────────────
async function drawRoute(lat1,lng1,lat2,lng2) {
  if(routeLine){routeLine.remove();routeLine=null;}
  try {
    const res=await fetch(`https://router.project-osrm.org/route/v1/driving/${lng1},${lat1};${lng2},${lat2}?overview=full&geometries=geojson`,{signal:AbortSignal.timeout?AbortSignal.timeout(5000):undefined});
    if(!res.ok)throw new Error();
    const d=await res.json();
    if(d.routes&&d.routes[0]) {
      const coords=d.routes[0].geometry.coordinates.map(([lng,lat])=>[lat,lng]);
      const distKm=+(d.routes[0].distance/1000).toFixed(1);
      const etaMins=Math.max(1,Math.round(d.routes[0].duration/60));
      if(selectedHospital) {
        selectedHospital={...selectedHospital,distance_km:distKm,eta_minutes:etaMins};
        refreshDrawer();
      }
      routeLine=L.polyline(coords,{color:'#FF6B35',weight:5,opacity:.85,lineCap:'round',lineJoin:'round'}).addTo(map);
    }
  } catch {
    // Straight line fallback
    routeLine=L.polyline([[lat1,lng1],[lat2,lng2]],{color:'#FF6B35',weight:4,opacity:.6,dashArray:'8 6'}).addTo(map);
  }
}

// ── Hold Management ──────────────────────────────────────
function bookSlot() {
  if(!selectedHospital)return;
  const ward=selectedHospital.wards.find(w=>w.ward_code===classification.ward)||selectedHospital.wards[0];
  if(!ward||ward.available_now<=0){alert('No beds available in '+ward.label+'. Please choose another hospital.');return;}

  ward.available_now=Math.max(0,ward.available_now-1);
  ward.held_now=(ward.held_now||0)+1;

  const otp=String(Math.floor(1000+Math.random()*9000));
  activeHold={
    hold_id:'hold_'+Date.now(),
    hospital_id:selectedHospital.id,
    hospital_name:selectedHospital.name,
    ward_code:ward.ward_code,
    ward_label:ward.label,
    otp_code:otp,
    seconds_left:900,
    total_seconds:900,
    status:'ACTIVE'
  };

  document.getElementById('hold-banner').classList.remove('hidden');
  document.getElementById('hb-hosp-name').textContent=selectedHospital.short_name+' — '+ward.label;
  document.getElementById('hb-otp').textContent=otp;

  startHoldTimer();
  renderDrawer(selectedHospital);
  drawerExpanded=true;
  document.getElementById('drawer').classList.add('expanded');

  // Also call backend if available
  fetch('/api/holds/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({hospital_id:selectedHospital.id,ward_code:ward.ward_code,hold_type:'CITIZEN',severity:classification.severity||'YELLOW',phone:'9999999999'})}).catch(()=>{});
}

function startHoldTimer() {
  if(holdTimer)clearInterval(holdTimer);
  holdTimer=setInterval(()=>{
    if(!activeHold){clearInterval(holdTimer);return;}
    activeHold.seconds_left--;
    if(activeHold.seconds_left<=0){clearInterval(holdTimer);releaseHoldInventory();activeHold=null;document.getElementById('hold-banner').classList.add('hidden');if(selectedHospital)renderDrawer(selectedHospital);}
    else {
      // Update timer in drawer if expanded
      const timerEl=document.querySelector('.hold-timer');
      if(timerEl){const mm=String(Math.floor(activeHold.seconds_left/60)).padStart(2,'0');const ss=String(activeHold.seconds_left%60).padStart(2,'0');timerEl.textContent=`${mm}:${ss}`;}
    }
  },1000);
}

function cancelHold() {
  if(holdTimer)clearInterval(holdTimer);
  releaseHoldInventory();
  activeHold=null;
  document.getElementById('hold-banner').classList.add('hidden');
  if(selectedHospital)renderDrawer(selectedHospital);
}

function releaseHoldInventory() {
  if(!activeHold)return;
  const h=hospitals.find(x=>x.id===activeHold.hospital_id);
  if(h){const w=h.wards.find(x=>x.ward_code===activeHold.ward_code);if(w){w.available_now++;w.held_now=Math.max(0,(w.held_now||0)-1);}}
}

function copyOtp(otp) {
  navigator.clipboard?.writeText(otp).then(()=>alert('OTP '+otp+' copied!')).catch(()=>{});
}

// ── Protocol Sheet ────────────────────────────────────────
function openProtocol() {
  if(!selectedHospital)return;
  const sheet=document.getElementById('protocol-sheet');
  sheet.classList.remove('hidden');
  const proto=PROTOCOLS[classification.protocol||'cardiac']||PROTOCOLS.cardiac;
  const sev=classification.severity||'YELLOW';
  const sevCls=sev==='RED'?'red':sev==='GREEN'?'green':'yellow';
  const govtH=hospitals.find(x=>x.is_govt), privH=hospitals.find(x=>!x.is_govt);
  const stepsHTML=(proto.steps||[]).map((s,i)=>`<li class="proto-step"><span class="proto-step-num">${i+1}</span><span class="proto-step-text">${s}</span></li>`).join('');
  sheet.innerHTML=`
    <div class="proto-header">
      <button class="proto-close" onclick="closeProtocol()">✕</button>
      <div class="proto-title">${proto.name}</div>
      <span class="proto-severity ${sevCls}">${sev} • ESI-1</span>
      <button onclick="openProtocol()" style="padding:4px 10px;border-radius:8px;border:none;background:var(--surface2);cursor:pointer;display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
        Share
      </button>
    </div>
    <div class="proto-body">
      <div style="margin-bottom:14px">
        <div style="font-size:16px;font-weight:900;color:var(--text-primary);margin-bottom:6px">${proto.title}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <span class="badge badge-orange">🏥 Target Ward: ${proto.ward_label}</span>
          <span class="badge badge-gray">Category: Emergency Medicine</span>
        </div>
      </div>

      <!-- Hospital Options -->
      ${(govtH||privH)?`
      <div class="proto-section">
        <div class="proto-section-title">Route Patient Immediately — <span style="color:var(--saffron)">2 Options</span></div>
        <div class="proto-hospitals">
          ${govtH?`<div class="proto-hosp-card govt-card">
            <div class="proto-hosp-tag" style="color:var(--green)">🏛️ GOVT HOSPITAL ${govtH.eta_minutes}m</div>
            <div class="proto-hosp-name">${govtH.short_name}</div>
            <div class="proto-hosp-meta">${govtH.distance_km} km away</div>
            <button class="proto-select-btn govt" onclick="selectHospital(window.HMAP['${govtH.id}']);closeProtocol()">SELECT →</button>
          </div>`:''}
          ${privH?`<div class="proto-hosp-card">
            <div class="proto-hosp-tag" style="color:var(--saffron)">🏥 PRIVATE HOSPITAL ${privH.eta_minutes}m</div>
            <div class="proto-hosp-name">${privH.short_name}</div>
            <div class="proto-hosp-meta">${privH.distance_km} km away</div>
            <button class="proto-select-btn private" onclick="selectHospital(window.HMAP['${privH.id}']);closeProtocol()">SELECT →</button>
          </div>`:''}
        </div>
      </div>`:''}

      <!-- Section 1: Overview -->
      <div class="proto-section">
        <div class="proto-section-title">1. What Kind of Problem Are We Facing? (Overview)</div>
        <div class="proto-section-box"><p>${classification.explanation||proto.title}</p></div>
      </div>

      <!-- Section 2: Do Now -->
      <div class="proto-section">
        <div class="proto-section-title">2. Do Immediately</div>
        <div class="proto-do-now">
          <div class="proto-do-now-label">Action Required NOW</div>
          <div class="proto-do-now-text">${proto.do_now}</div>
        </div>
        <ul class="proto-steps-list">
          ${stepsHTML}
        </ul>
      </div>

      <!-- Book CTA -->
      ${selectedHospital?`<button class="proto-book-btn" onclick="closeProtocol();bookSlot()">
        ${activeHold?'🔒 SLOT ALREADY BOOKED':'🔒 BOOK MY SLOT AND START →'}
      </button>`:''}
    </div>
  `;
  window.HMAP={};hospitals.forEach(x=>window.HMAP[x.id]=x);
}

function closeProtocol() {
  document.getElementById('protocol-sheet').classList.add('hidden');
}

// ── Location Modal ────────────────────────────────────────
let suggestTimer=null, geocodeAbort=null;
function openLocModal() {
  document.getElementById('loc-modal').classList.remove('hidden');
  setTimeout(()=>document.getElementById('address-input').focus(),100);
}
function closeLocModal() {
  document.getElementById('loc-modal').classList.add('hidden');
  document.getElementById('suggestions').style.display='none';
  document.getElementById('address-input').value='';
}
function useGPSAndClose() {
  closeLocModal();
  requestGPS();
}

const addrInput=document.getElementById('address-input');
addrInput.addEventListener('input',e=>{
  const v=e.target.value.trim();
  document.getElementById('modal-set-btn').disabled=!v;
  clearTimeout(suggestTimer);
  if(v.length<2){document.getElementById('suggestions').style.display='none';return;}
  document.getElementById('addr-searching').style.display='flex';
  suggestTimer=setTimeout(()=>fetchSuggestions(v),300);
});

async function fetchSuggestions(q) {
  try {
    const res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&addressdetails=1&limit=5&countrycodes=in`,{headers:{'Accept-Language':'en'}});
    document.getElementById('addr-searching').style.display='none';
    if(!res.ok)return;
    const data=await res.json();
    const box=document.getElementById('suggestions');
    if(!data.length){box.style.display='none';return;}
    box.innerHTML=data.map(item=>{
      const parts=(item.display_name||'').split(',').map(s=>s.trim());
      return`<div class="suggestion-item" onclick="applyCoords(${item.lat},${item.lon},'${encodeURIComponent(parts.slice(0,3).join(', '))}')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FF6B35" stroke-width="2.5" style="flex-shrink:0;margin-top:2px"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
        <div><div class="suggestion-title">${parts.slice(0,2).join(', ')}</div><div class="suggestion-sub">${parts.slice(2,5).join(', ')}</div></div>
      </div>`;
    }).join('');
    box.style.display='block';
  } catch { document.getElementById('addr-searching').style.display='none'; }
}

function applyCoords(lat,lng,encodedAddr) {
  userLat=+lat; userLng=+lng;
  userAddress=decodeURIComponent(encodedAddr);
  document.getElementById('loc-address').textContent=userAddress;
  closeLocModal();
  recomputeHospitals();
  placeUserMarker();
  placeHospitalMarkers();
  updateQuickCards();
  if(map)map.setView([userLat,userLng],16,{animate:true});
  localStorage.setItem('pg_loc',JSON.stringify({lat:userLat,lng:userLng,addr:userAddress}));
}

async function geocodeInput() {
  const q=document.getElementById('address-input').value.trim();
  if(!q)return;
  document.getElementById('modal-set-btn').textContent='Locating...';
  try {
    const res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=1`,{headers:{'Accept-Language':'en'}});
    const data=await res.json();
    if(data.length) applyCoords(data[0].lat,data[0].lon,encodeURIComponent(data[0].display_name.split(',').slice(0,3).join(', ')));
    else alert('Address not found. Try a more specific name.');
  } catch { alert('Geocoding failed. Check internet connection.'); }
  document.getElementById('modal-set-btn').textContent='Set Location';
}

// ── Quick Cards ───────────────────────────────────────────
function updateQuickCards() {
  recomputeHospitals();
  const nearest=hospitals[0];
  if(nearest){
    document.getElementById('qc-nearest-beds').textContent=nearest.wards.reduce((a,w)=>a+w.available_now,0)+' beds free';
    document.getElementById('qc-nearest-eta').textContent=nearest.eta_minutes+' min away';
  }
}

// ── Voice Input ───────────────────────────────────────────
let recognition=null, isListening=false;
(function initSpeech(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return;
  recognition=new SR();
  recognition.continuous=false;recognition.interimResults=false;recognition.lang='en-IN';
  recognition.onstart=()=>{isListening=true;document.getElementById('mic-btn').classList.add('listening');};
  recognition.onend=()=>{isListening=false;document.getElementById('mic-btn').classList.remove('listening');};
  recognition.onerror=()=>{isListening=false;document.getElementById('mic-btn').classList.remove('listening');};
  recognition.onresult=e=>{const t=e.results[0][0].transcript;if(t){searchInput.value=t;submitSearch();}};
})();

function toggleMic() {
  if(!recognition){alert('Voice input supported in Chrome, Edge, Safari.');return;}
  if(isListening){recognition.stop();}else{try{recognition.start();}catch{}}
}

// ── Theme Toggle ──────────────────────────────────────────
function toggleTheme() {
  isDark=!isDark;
  document.getElementById('app').setAttribute('data-theme',isDark?'dark':'light');
  const icon=document.getElementById('theme-icon');
  icon.innerHTML=isDark
    ?'<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>'
    :'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
}

// ── Call Helpers ──────────────────────────────────────────
function callAmbulance(){window.location.href='tel:108';}
function callHospital(phone){window.location.href='tel:'+phone.replace(/\s+/g,'');}

// ── Restore Saved Location ────────────────────────────────
(function restoreLocation(){
  try{const s=localStorage.getItem('pg_loc');if(s){const d=JSON.parse(s);userLat=d.lat;userLng=d.lng;userAddress=d.addr;document.getElementById('loc-address').textContent=userAddress;}}catch{}
})();

// ── Boot ──────────────────────────────────────────────────
recomputeHospitals();
initMap();
requestGPS();
updateQuickCards();

// Fetch from backend if available
fetch('/api/facilities').then(r=>r.ok?r.json():null).then(data=>{
  if(data&&Array.isArray(data)&&data.length){
    // Merge backend beds into our hospital list
    data.forEach(bh=>{
      const local=hospitals.find(h=>h.id===bh.id||h.name===bh.name);
      if(local&&bh.wards){local.wards=bh.wards;}
    });
    updateQuickCards();
    if(selectedHospital)renderDrawer(selectedHospital);
  }
}).catch(()=>{});
</script>
