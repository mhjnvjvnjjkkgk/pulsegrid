<!-- Interactive State Simulation (Micro-interactions) -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const micBtn = document.querySelector('button[aria-label="Voice Symptom Triage"]');
      const searchInput = document.querySelector('input[type="text"]');
      
      if (micBtn && searchInput) {
        micBtn.addEventListener('click', () => {
          micBtn.classList.toggle('bg-[#00F0FF]');
          micBtn.classList.toggle('text-[#05070B]');
          
          if (searchInput.placeholder === "Say YOUR SYMPTOM HERE...") {
            searchInput.placeholder = "Listening for emergency symptoms...";
            setTimeout(() => {
              searchInput.value = "Severe chest pain radiating to left arm";
            }, 1200);
          } else {
            searchInput.placeholder = "Say YOUR SYMPTOM HERE...";
            searchInput.value = "";
          }
        });
      }
    });
  </script>
